<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LeetCode to GitHub</title>
<style>
  :root {
    --bg-top: #1E2634; --bg-bottom: #0B0F17;
    --accent: #FFA116; --accent-openai: #58A6FF;
    --text: #E6EDF3; --text-dim: #8A97A8;
    --border: rgba(230,237,243,0.12);
  }
  * { box-sizing: border-box; }
  body {
    width: 300px; margin: 0; padding: 16px;
    background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 13px; line-height: 1.45;
  }
  .header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .header img { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; }
  .header .title { font-weight: 600; font-size: 13.5px; }
  .header .subtitle { font-size: 11px; color: var(--text-dim); }

  .section { margin-bottom: 16px; }
  .section:last-of-type { margin-bottom: 12px; }
  .section-label { display: flex; align-items: center; gap: 6px; font-weight: 600; margin-bottom: 8px; }
  .section-label .icon { width: 14px; height: 14px; display: inline-flex; flex-shrink: 0; }

  input, select {
    width: 100%; padding: 7px 9px; margin-bottom: 8px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 12.5px; font-family: inherit;
  }
  input::placeholder { color: var(--text-dim); }
  input:focus, select:focus { outline: none; border-color: var(--accent); background: rgba(255,161,22,0.06); }
  input:disabled { opacity: 0.4; }
  select { cursor: pointer; }

  .hint { font-size: 11px; color: var(--text-dim); margin: -2px 0 4px; }

  button#save {
    width: 100%; padding: 9px; margin-top: 4px;
    background: var(--accent); color: #1a1206; border: none; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: filter 0.12s ease;
  }
  button#save:hover { filter: brightness(1.08); }
  button#save:active { filter: brightness(0.95); }

  .status {
    text-align: center; font-size: 11.5px; color: var(--accent); height: 14px;
    margin-top: 8px; opacity: 0; transition: opacity 0.2s ease;
  }
  .status.visible { opacity: 1; }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="">
    <div>
      <div class="title">LeetCode to GitHub</div>
      <div class="subtitle">Push accepted solutions automatically</div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">
      <span class="icon"><svg viewBox="0 0 24 24" style="width:100%;height:100%;fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><polyline points="9,6 4,12 9,18"/><polyline points="15,6 20,12 15,18"/></svg></span>
      <span>GitHub</span>
    </div>
    <input id="repo" type="text" placeholder="username/repo">
    <input id="token" type="password" placeholder="GitHub PAT">
  </div>

  <div class="section">
    <div class="section-label">
      <span class="icon"><svg viewBox="0 0 24 24" style="width:100%;height:100%"><polygon points="12,3 14.12,9.88 21,12 14.12,14.12 12,21 9.88,14.12 3,12 9.88,9.88" style="fill:var(--accent)"/></svg></span>
      <span>AI features (optional)</span>
    </div>
    <select id="aiProvider">
      <option value="groq">Groq (free)</option>
      <option value="openai">OpenAI</option>
    </select>
    <input id="groqApiKey" type="password" placeholder="Groq API key">
    <input id="openaiApiKey" type="password" placeholder="OpenAI API key">
    <p class="hint">Pick a provider above and paste its key. Leave both blank to skip - everything else works without it.</p>
  </div>

  <button id="save">Save</button>
  <div id="status" class="status">Saved</div>

  <script src="popup.js"></script>
</body>
</html>
